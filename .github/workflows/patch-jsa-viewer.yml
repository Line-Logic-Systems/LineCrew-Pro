name: Patch JSA in-app viewer

on:
  push:
    branches: [feature/jsa-inapp-viewer]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsa-inapp-viewer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/add-jsa-inapp-viewer.mjs
      - name: Commit viewer UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all uploaded JSA pages inside the app"
          git push origin HEAD:feature/jsa-inapp-viewer
