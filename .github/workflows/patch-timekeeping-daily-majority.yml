name: Patch timekeeping daily majority
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timekeeping-daily-majority-exception
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_timekeeping_daily_majority.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timekeeping-payroll.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix daily crew-hour majority exceptions"
          git push origin HEAD:fix/timekeeping-daily-majority-exception
