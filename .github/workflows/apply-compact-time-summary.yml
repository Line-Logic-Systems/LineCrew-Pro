name: Apply Compact Time Summary
on:
  push:
    branches: [ui/compact-time-summary]
    paths: [.github/workflows/apply-compact-time-summary.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/compact-time-summary
      - name: Patch summary and locate redundant status
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('timekeeping-report-v2.js')
          s=p.read_text()
          anchor='      .tk-report-toolbar button{width:auto;margin:0;padding:6px 9px;font-size:12px}\n'
          css='''      #tkSummary{display:flex!important;align-items:center;gap:0!important;flex-wrap:wrap;margin:6px 0 8px!important;padding:0!important;background:#f8fafc;border:1px solid #dce5ed;border-radius:9px;overflow:hidden}\n      #tkSummary>div{display:flex!important;align-items:baseline;gap:4px;min-width:0!important;width:auto!important;flex:0 0 auto!important;padding:5px 9px!important;margin:0!important;border:0!important;border-right:1px solid #dce5ed!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;font-size:10px!important;white-space:nowrap}\n      #tkSummary>div:last-child{border-right:0!important}\n      #tkSummary>div strong{font-size:13px!important;line-height:1!important;margin:0!important}\n      @media(max-width:520px){#tkSummary>div{padding:5px 6px!important;font-size:9px!important}#tkSummary>div strong{font-size:12px!important}}\n'''
          if css not in s:
            if anchor not in s: raise SystemExit('summary style anchor not found')
            s=s.replace(anchor,anchor+css,1)
          p.write_text(s)
          print('--- status text matches ---')
          for f in list(Path('.').rglob('*.js'))+list(Path('.').rglob('*.html')):
            if '.git' in f.parts: continue
            try: text=f.read_text(errors='ignore')
            except: continue
            for i,line in enumerate(text.splitlines(),1):
              if 'time segment' in line.lower() or ('Showing' in line and 'through' in line):
                print(f'{f}:{i}:{line.strip()}')
          PY
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timekeeping-report-v2.js
          git diff --cached --quiet || git commit -m "Compact time report summary"
          git push origin HEAD:ui/compact-time-summary
