name: Validate Utility Activity Attribution

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate-utility-activity-company-attribution.mjs'
      - '.github/workflows/validate-utility-activity-attribution.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate-utility-activity-company-attribution.mjs'
      - '.github/workflows/validate-utility-activity-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate Utility activity company attribution
        run: node scripts/validate-utility-activity-company-attribution.mjs
