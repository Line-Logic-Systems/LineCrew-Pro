name: Marketing Site Validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate-marketing-site.mjs"
      - ".vercelignore"
      - ".github/workflows/validate-marketing-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate-marketing-site.mjs"
      - ".vercelignore"
      - ".github/workflows/validate-marketing-site.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/validate-marketing-site.mjs
