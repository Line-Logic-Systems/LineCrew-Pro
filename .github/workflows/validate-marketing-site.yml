name: Marketing Site Validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate-marketing-site.mjs"
      - ".vercelignore"
      - ".github/workflows/validate-marketing-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate-marketing-site.mjs"
      - ".vercelignore"
      - ".github/workflows/validate-marketing-site.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-marketing-site.mjs
