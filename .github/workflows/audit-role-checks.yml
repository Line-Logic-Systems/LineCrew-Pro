name: Audit Role Checks

on:
  push:
    branches:
      - feature/owner-superintendent-roles
    paths:
      - scripts/audit-role-checks.mjs
      - .github/workflows/audit-role-checks.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/owner-superintendent-roles
      - run: node scripts/audit-role-checks.mjs
      - name: Commit audit report
        run: |
          if git diff --quiet -- internal-docs/ROLE_AUDIT.md; then
            echo "No audit changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal-docs/ROLE_AUDIT.md
          git commit -m "Audit legacy role checks for Owner and Superintendent"
          git push origin HEAD:feature/owner-superintendent-roles
