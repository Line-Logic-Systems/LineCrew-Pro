name: Independent Disaster Backup

on:
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backup client
        run: npm install --no-save @supabase/supabase-js@2
      - name: Export Supabase data and storage
        env:
          SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-supabase.mjs
      - name: Archive full Git repository
        run: |
          git bundle create backup-output/linecrew-pro-repository.bundle --all
          git log -1 --format='%H %cI' > backup-output/repository-head.txt
      - name: Package backup
        run: tar -czf linecrew-pro-backup.tgz backup-output
      - name: Upload encrypted-platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: linecrew-pro-disaster-backup-${{ github.run_number }}
          path: linecrew-pro-backup.tgz
          retention-days: 30
          if-no-files-found: error
      - name: Copy backup to Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_BACKUP_CONNECTION_STRING }}
        run: |
          test -n "$AZURE_STORAGE_CONNECTION_STRING"
          BLOB_NAME="linecrew-pro-backup-${GITHUB_RUN_NUMBER}-$(date -u +%Y%m%dT%H%M%SZ).tgz"
          az storage blob upload \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name linecrew-pro-backups \
            --name "$BLOB_NAME" \
            --file linecrew-pro-backup.tgz \
            --overwrite false \
            --only-show-errors
          echo "Azure backup uploaded as $BLOB_NAME"
