name: Independent Disaster Backup

on:
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Export Supabase data and storage
        env:
          SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-supabase.mjs
      - name: Verify table, object, and file integrity
        run: |
          BACKUP_PATH="$(find backup-output -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$BACKUP_PATH"
          node scripts/verify-backup.mjs "$BACKUP_PATH"
      - name: Create full logical database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          mkdir -p backup-output/postgres
          docker run --rm \
            --env SUPABASE_DB_URL \
            --volume "$PWD/backup-output/postgres:/backup" \
            postgres:17-alpine \
            sh -ceu 'pg_dump --dbname="$SUPABASE_DB_URL" --format=custom --no-owner --schema=auth --schema=public --schema=storage --file=/backup/linecrew-postgres.dump && pg_restore --list /backup/linecrew-postgres.dump > /backup/linecrew-postgres.list'
      - name: Package and verify the post-restore security gate
        run: |
          cp scripts/post-restore-security.sql backup-output/postgres/post-restore-security.sql
          cp scripts/verify-post-restore-security.sql backup-output/postgres/verify-post-restore-security.sql
          sha256sum \
            backup-output/postgres/post-restore-security.sql \
            backup-output/postgres/verify-post-restore-security.sql \
            > backup-output/postgres/security-files.sha256
          sha256sum --check backup-output/postgres/security-files.sha256
      - name: Archive full Git repository
        run: |
          git bundle create backup-output/linecrew-pro-repository.bundle --all
          git log -1 --format='%H %cI' > backup-output/repository-head.txt
      - name: Package backup
        run: tar -czf linecrew-pro-backup.tgz backup-output
      - name: Upload encrypted-platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linecrew-pro-disaster-backup-${{ github.run_number }}
          path: linecrew-pro-backup.tgz
          retention-days: 30
          if-no-files-found: error
      - name: Copy backup to Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_BACKUP_CONNECTION_STRING }}
        run: |
          test -n "$AZURE_STORAGE_CONNECTION_STRING"
          BLOB_NAME="linecrew-pro-backup-${GITHUB_RUN_NUMBER}-$(date -u +%Y%m%dT%H%M%SZ).tgz"
          az storage blob upload \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name linecrew-pro-backups \
            --name "$BLOB_NAME" \
            --file linecrew-pro-backup.tgz \
            --overwrite false \
            --only-show-errors
          echo "Azure backup uploaded as $BLOB_NAME"
      - name: Resolve prior recovery alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/manage-recovery-alert.sh success "Independent Disaster Backup"
      - name: Open immediate recovery alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/manage-recovery-alert.sh failure "Independent Disaster Backup"
