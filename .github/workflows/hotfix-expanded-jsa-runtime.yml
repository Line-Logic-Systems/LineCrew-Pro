name: Hotfix Expanded JSA Runtime

on:
  push:
    branches:
      - hotfix/expanded-jsa-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/expanded-jsa-runtime
          fetch-depth: 0
      - name: Patch runtime client reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('expanded-jsa.js')
          text = p.read_text()
          old = "await supabaseClient.rpc('create_standalone_jsa_v2'"
          new = "await sb.rpc('create_standalone_jsa_v2'"
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          elif new not in text:
              raise SystemExit('Expected expanded JSA RPC call was not found')
          PY
      - name: Verify syntax
        run: node --check expanded-jsa.js
      - name: Commit patch
        run: |
          if git diff --quiet -- expanded-jsa.js; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expanded-jsa.js
          git commit -m "Fix expanded JSA Supabase client reference"
          git push origin HEAD:hotfix/expanded-jsa-runtime
