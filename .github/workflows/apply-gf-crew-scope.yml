name: Apply GF Crew Scope
'on':
  push:
    branches:
      - feature/gf-crew-scope-jsa-history
    paths:
      - .github/workflows/apply-gf-crew-scope.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/gf-crew-scope-jsa-history
      - name: Apply patch
        run: python scripts/apply-gf-crew-scope.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html expanded-jsa.js gf-crew-scope.js
          git diff --cached --quiet || git commit -m 'Scope GF approvals and JSAs to assigned crews'
          git push origin HEAD:feature/gf-crew-scope-jsa-history
