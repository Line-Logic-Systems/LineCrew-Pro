name: Fix Payroll Valid Long Shifts
on:
  push:
    branches:
      - fix/payroll-valid-long-shifts
    paths:
      - .github/workflows/fix-payroll-valid-long-shifts.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/payroll-valid-long-shifts
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('timekeeping-payroll.js')
          s=p.read_text()
          old="if(total>16)out.push({type:'high',employee:employee.full_name||'',date,message:`${total.toFixed(2)} total hours recorded.`});"
          new="if(total>24)out.push({type:'high',employee:employee.full_name||'',date,message:`${total.toFixed(2)} total hours recorded — more than 24 hours in one day.`});"
          if old not in s:
              raise SystemExit('high-hour exception rule not found')
          s=s.replace(old,new,1)
          s=s.replace('This period has no high-hour totals, multi-job review flags, or possible duplicate time segments.','This period has no impossible daily-hour totals, multi-job review flags, or possible duplicate time segments.',1)
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timekeeping-payroll.js
          git diff --cached --quiet || git commit -m "Allow legitimate long linework shifts in payroll review"
          git push origin HEAD:fix/payroll-valid-long-shifts
