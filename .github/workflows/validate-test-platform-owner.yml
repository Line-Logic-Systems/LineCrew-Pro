name: Validate test platform owner tooling

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/manage-test-platform-owner.mjs'
      - 'scripts/validate-test-platform-owner.mjs'
      - '.github/workflows/manage-test-platform-owner.yml'
      - '.github/workflows/validate-test-platform-owner.yml'
  pull_request:
    paths:
      - 'scripts/manage-test-platform-owner.mjs'
      - 'scripts/validate-test-platform-owner.mjs'
      - '.github/workflows/manage-test-platform-owner.yml'
      - '.github/workflows/validate-test-platform-owner.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate guarded test owner manager
        run: node --experimental-vm-modules scripts/validate-test-platform-owner.mjs
