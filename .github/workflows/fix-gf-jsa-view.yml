name: Fix GF Completed JSA View
on:
  push:
    branches:
      - feature/gf-completed-jsa-view
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gf-completed-jsa-view
      - name: Patch JSA renderer
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='function renderSafetyJsas(){'; new='function renderSafetyJsas(){\\nconst foremanEntryWorkspace = currentUserRole() === \\\"foreman\\\";'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix completed JSA rendering for leadership'
          git push origin HEAD:feature/gf-completed-jsa-view