name: Fix GF Completed JSA View
on:
  push:
    branches: [feature/gf-completed-jsa-view]
    paths: [.github/workflows/fix-gf-jsa-view.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/gf-completed-jsa-view
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function renderSafetyJsas(){
const records = getFilteredSafetyJsas();
$('safetyJsaList').replaceChildren();"""
          new="""function renderSafetyJsas(){
const foremanEntryWorkspace = currentUserRole() === 'foreman';
const records = getFilteredSafetyJsas();
$('safetyJsaList').replaceChildren();"""
          if old not in s:
              raise SystemExit('renderSafetyJsas anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix completed JSA rendering for leadership"
          git push origin HEAD:feature/gf-completed-jsa-view
# trigger