name: Delete Exposed Backup Artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-exposed-backup-artifacts.yml

permissions:
  actions: write
  contents: read

jobs:
  delete-approved-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Delete the ten approved GitHub backup artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_ids=(
            9355371087
            9356081744
            9491313312
            9506198491
            9506296745
            9514451078
            9556846306
            9600844318
            9620699503
            9702303826
          )

          for artifact_id in "${artifact_ids[@]}"; do
            status="$({
              curl --silent --show-error \
                --output "delete-${artifact_id}.json" \
                --write-out '%{http_code}' \
                --request DELETE \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            })"

            if [[ "${status}" != "204" && "${status}" != "404" ]]; then
              echo "Artifact ${artifact_id} deletion failed with HTTP ${status}." >&2
              sed -n '1,20p' "delete-${artifact_id}.json" >&2
              exit 1
            fi

            echo "Artifact ${artifact_id} is absent (HTTP ${status})."
          done
