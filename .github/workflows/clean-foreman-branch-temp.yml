name: Clean Foreman Branch Temp
on:
  push:
    branches:
      - fix/foreman-first-at-source
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foreman-first-at-source
          fetch-depth: 0
      - name: Restore add-on script from main
        run: |
          git fetch origin main
          git checkout origin/main -- timekeeping-input-v2.js
      - name: Commit cleanup
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "LineCrew Pro Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove obsolete post-render Foreman pinning"
          git push origin HEAD:fix/foreman-first-at-source