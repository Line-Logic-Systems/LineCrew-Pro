name: Apply Role UI Patch 7
on:
  push:
    branches: [feature/owner-superintendent-roles]
    paths: [scripts/apply-role-ui-patch-7.mjs, .github/workflows/apply-role-ui-patch-7.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feature/owner-superintendent-roles
      - run: node scripts/apply-role-ui-patch-7.mjs
      - run: node scripts/validate-app.mjs
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use role-aware Price Book controls"
          git push origin HEAD:feature/owner-superintendent-roles
