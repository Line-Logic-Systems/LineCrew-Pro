name: Deploy Supabase Edge Functions

# Edge Functions do not ship with the Vercel deploy. Without this workflow they
# are deployed by hand, so the repository and the running production functions
# can drift apart with no way to tell from the code.
#
# This never runs on pull_request. The repository is public, so a workflow that
# built untrusted PR code with SUPABASE_ACCESS_TOKEN in scope would be an
# exfiltration path. Merged code on main only.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Supabase CLI
        run: npm install -g supabase@2.116.0

      - name: Deploy every Edge Function to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Deploying all functions rather than only the changed ones is
        # deliberate: it makes production match the repository on every run,
        # which is the drift this workflow exists to remove. Function secrets
        # (Stripe keys, the webhook signing secret, BILLING_PLAN_PRICE_MAP) are
        # stored separately in Supabase and are not touched by a code deploy.
        run: supabase functions deploy --project-ref ldgkyxuozbozgkvwzadg
