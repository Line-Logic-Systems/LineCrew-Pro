name: Validate platform owner and billing

on:
  push:
    branches:
      - feature/platform-owner-billing
      - chatgpt-dev
  pull_request:
    paths:
      - 'owner.html'
      - 'billing.html'
      - 'docs/PLATFORM_OWNER_BILLING.md'
      - 'supabase/migrations/20260818_platform_owner_and_billing.sql'
      - 'supabase/migrations/20260818_crew_tier_usage_policy.sql'
      - 'supabase/migrations/20260818_crew_tier_automation_and_visibility.sql'
      - 'supabase/functions/create-billing-checkout/**'
      - 'supabase/functions/create-billing-portal/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'scripts/validate-platform-billing.mjs'
      - 'scripts/test-platform-billing-isolation.mjs'
      - '.github/workflows/validate-platform-billing.yml'
      - '.github/workflows/test-platform-billing-isolation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate platform billing foundation
        run: |
          node scripts/validate-platform-billing.mjs
          node --check scripts/test-platform-billing-isolation.mjs
      - name: Type-check Stripe billing Edge Functions
        run: |
          deno check supabase/functions/create-billing-checkout/index.ts
          deno check supabase/functions/create-billing-portal/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
