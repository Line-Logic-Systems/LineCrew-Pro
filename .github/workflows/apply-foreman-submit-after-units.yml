name: Apply Foreman Submit After Units
on:
  push:
    branches: [feature/foreman-submit-after-units]
    paths:
      - scripts/apply-foreman-submit-after-units.mjs
      - .github/workflows/apply-foreman-submit-after-units.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feature/foreman-submit-after-units
      - run: node scripts/apply-foreman-submit-after-units.mjs
      - run: node scripts/validate-app.mjs
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Offer GF submission after unit entry"
          git push origin HEAD:feature/foreman-submit-after-units
