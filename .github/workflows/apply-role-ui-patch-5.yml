name: Apply Role UI Patch 5
on:
  push:
    branches: [feature/owner-superintendent-roles]
    paths: [scripts/apply-role-ui-patch-5.mjs, .github/workflows/apply-role-ui-patch-5.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-superintendent-roles
      - run: node scripts/apply-role-ui-patch-5.mjs
      - run: node scripts/validate-app.mjs
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire report review and record controls to role hierarchy"
          git push origin HEAD:feature/owner-superintendent-roles
