name: Validate LineCrew Pro

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chatgpt-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-linecrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate application
        run: node scripts/validate-app.mjs

      - name: Audit legacy role checks
        run: |
          node scripts/audit-role-checks.mjs
          cat docs/ROLE_AUDIT.md
