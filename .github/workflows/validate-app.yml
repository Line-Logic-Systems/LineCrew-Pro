name: Validate LineCrew Pro

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chatgpt-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-linecrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate application
        run: node scripts/validate-app.mjs

      - name: Validate end-to-end regression guardrails
        run: node scripts/validate-end-to-end-regressions.mjs

      - name: Verify GitHub Actions are commit-pinned
        run: node scripts/validate-github-action-pins.mjs

      - name: Validate flexible JSA workflow
        run: node scripts/validate-flexible-jsa.mjs

      - name: Audit legacy role checks
        run: |
          node scripts/audit-role-checks.mjs
          cat internal-docs/ROLE_AUDIT.md

      - name: Validate Superintendent compatibility generator
        run: |
          node scripts/generate-superintendent-compatibility.mjs
          test -s supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
          grep -q "linecrew_has_capability" supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
          grep -q "superintendent" supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
          head -n 40 supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
