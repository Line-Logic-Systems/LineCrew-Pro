name: Validate LineCrew Pro

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chatgpt-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-linecrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate application
        run: |
          node scripts/validate-app.mjs
          node scripts/validate-manager-safety-roles.mjs

      - name: Validate front-end stability boundaries
        run: node scripts/validate-front-end-stability.mjs

      - name: Validate core field workflows
        run: node scripts/validate-core-field-workflows.mjs

      - name: Validate observer scoping
        run: node scripts/validate-observer-scoping.mjs

      - name: Validate whole-app observer inventory
        run: node scripts/validate-body-observer-inventory.mjs

      - name: Validate GF scope regressions
        run: node scripts/validate-gf-scope-regressions.mjs

      - name: Validate Foreman field tools
        run: node scripts/validate-foreman-field-tools.mjs

      - name: Validate GF review and theme
        run: node scripts/validate-gf-review-theme.mjs

      - name: Validate Storm Mode
        run: node scripts/validate-storm-mode-regressions.mjs

      - name: Validate job packet map retention
        run: node scripts/validate-job-packet-map-retention.mjs

      - name: Validate platform billing and entitlement
        run: node scripts/validate-platform-billing.mjs

      - name: Validate Utility Portal RPC output contract
        run: node tests/utility-portal/check-migration-rpc-signatures.mjs

      - name: Validate Utility Portal invitations and read-only UI
        run: node scripts/validate-utility-portal-ui.mjs

      - name: Validate onboarding and invitation account setup
        run: node scripts/validate-beta-onboarding.mjs

      - name: Validate leadership time and role boundaries
        run: node scripts/validate-leadership-self-time.mjs

      - name: Validate company logo upload and branding
        run: node scripts/validate-company-logo-upload.mjs

      - name: Validate Admin AI assistant safety boundaries
        run: |
          node scripts/validate-assistant-knowledge.mjs
          node scripts/validate-assistant-live-context.mjs
          node scripts/validate-assistant-memory.mjs

      - name: Validate marketing site, pricing, and Beta funnel
        run: node scripts/validate-marketing-site.mjs

      - name: Validate workspace and navigation placement
        run: node scripts/validate-workspace-navigation.mjs

      - name: Validate staged App Core modularization
        run: node scripts/validate-app-core-module.mjs

      - name: Validate staged Jobs modularization
        run: node scripts/validate-jobs-core-module.mjs

      - name: Validate staged Assistant modularization
        run: node scripts/validate-assistant-core-module.mjs

      - name: Validate staged Billing modularization
        run: node scripts/validate-billing-core-module.mjs

      - name: Validate staged Notifications modularization
        run: node scripts/validate-notifications-core-module.mjs

      - name: Validate staged Daily Report modularization
        run: node scripts/validate-daily-report-core-module.mjs

      - name: Validate staged Production modularization
        run: node scripts/validate-production-core-module.mjs

      - name: Validate Production primary markup runtime handoff
        run: node scripts/validate-production-primary-markup-runtime.mjs

      - name: Validate Production presentation boundaries
        run: node scripts/validate-production-presentation-regressions.mjs

      - name: Validate staged Price Book modularization
        run: node scripts/validate-price-book-core-module.mjs

      - name: Validate end-to-end regression guardrails
        run: node scripts/validate-end-to-end-regressions.mjs

      - name: Validate job-packet model fallback
        run: node supabase/functions/parse-utility-job-packet/packet-logic.test.mjs

      - name: Verify GitHub Actions are commit-pinned
        run: node scripts/validate-github-action-pins.mjs

      - name: Validate flexible JSA workflow
        run: node scripts/validate-flexible-jsa.mjs

      - name: Audit legacy role checks
        run: |
          node scripts/audit-role-checks.mjs
          cat internal-docs/ROLE_AUDIT.md

      - name: Validate Superintendent compatibility generator
        run: |
          node scripts/generate-superintendent-compatibility.mjs
          test -s supabase/migrations/archive/202608190200_superintendent_legacy_compatibility.sql
          grep -q "linecrew_has_capability" supabase/migrations/archive/202608190200_superintendent_legacy_compatibility.sql
          grep -q "superintendent" supabase/migrations/archive/202608190200_superintendent_legacy_compatibility.sql
          head -n 40 supabase/migrations/archive/202608190200_superintendent_legacy_compatibility.sql
