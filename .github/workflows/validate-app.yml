name: Validate LineCrew Pro

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chatgpt-dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-linecrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply JSA camera patch on feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/jsa-camera-capture'
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout "${{ github.head_ref }}"
          node scripts/add-jsa-camera.mjs
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Add direct camera capture for uploaded JSAs"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Validate application
        run: node scripts/validate-app.mjs

      - name: Validate flexible JSA workflow
        run: node scripts/validate-flexible-jsa.mjs

      - name: Audit legacy role checks
        run: |
          node scripts/audit-role-checks.mjs
          cat docs/ROLE_AUDIT.md

      - name: Validate Superintendent compatibility generator
        run: |
          node scripts/generate-superintendent-compatibility.mjs
          test -s supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
          grep -q "linecrew_has_capability" supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
          grep -q "superintendent" supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
          head -n 40 supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
