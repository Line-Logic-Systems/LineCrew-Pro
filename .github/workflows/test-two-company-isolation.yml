name: Test two-company isolation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      # Role, capability and money-visibility gating is read and applied in
      # index.html, so a change there can alter who reaches another company's
      # data without touching a migration. Cross-company isolation is exactly
      # what this job proves, so it runs for those changes too.
      - 'index.html'
      - 'scripts/test-two-company-isolation.mjs'
      - '.github/workflows/test-two-company-isolation.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DISPOSABLE_ONLY to confirm this targets a disposable Supabase project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: isolation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: isolation-test
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      LINECREW_ISOLATION_TEST_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'DISPOSABLE_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify disposable-project confirmation
        run: test "$LINECREW_ISOLATION_TEST_CONFIRM" = "DISPOSABLE_ONLY"
      - name: Run two-company isolation attacks
        run: node scripts/test-two-company-isolation.mjs
