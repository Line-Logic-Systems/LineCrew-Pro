name: Apply Timekeeping Detail Source
on:
  push:
    branches: [fix/timekeeping-perdiem-admin-view]
    paths: [scripts/patch-timekeeping-detail-source.mjs]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timekeeping-perdiem-admin-view
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-timekeeping-detail-source.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expanded-jsa.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh timekeeping browser assets"
          git push origin HEAD:fix/timekeeping-perdiem-admin-view
