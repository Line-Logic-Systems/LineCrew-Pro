name: Manage test platform owner

on:
  workflow_dispatch:
    inputs:
      email:
        description: Existing Auth user email in the disposable Supabase test project
        required: true
        type: string
      action:
        description: Grant or revoke test platform-owner access
        required: true
        type: choice
        options:
          - grant
          - revoke
      confirmation:
        description: Type DISPOSABLE_ONLY to confirm this targets a disposable Supabase project
        required: true
        type: string

permissions:
  contents: read

jobs:
  manage-test-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: isolation-test
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      PLATFORM_OWNER_EMAIL: ${{ inputs.email }}
      PLATFORM_OWNER_ACTION: ${{ inputs.action }}
      LINECREW_ISOLATION_TEST_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify disposable-project confirmation
        run: test "$LINECREW_ISOLATION_TEST_CONFIRM" = "DISPOSABLE_ONLY"
      - name: Manage test platform-owner access
        run: node scripts/manage-test-platform-owner.mjs
