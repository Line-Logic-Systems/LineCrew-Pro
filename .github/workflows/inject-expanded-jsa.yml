name: Inject Expanded JSA

on:
  push:
    branches:
      - main
      - feature/expanded-digital-jsa

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Inject expanded JSA script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tag = '<script src="expanded-jsa.js?v=20260819"></script>'
          injected = f'  {tag}\n'
          # Remove any prior injected copy, including one accidentally placed
          # inside a printable HTML string, then inject at the real final body tag.
          text = text.replace(injected, '')
          idx = text.rfind('</body>')
          if idx < 0:
              raise SystemExit('index.html is missing the final </body> tag')
          text = text[:idx] + injected + text[idx:]
          p.write_text(text)
          PY
      - name: Verify JavaScript syntax
        run: node --check expanded-jsa.js
      - name: Commit injected tag when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Expanded JSA script tag already present at the final body tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load expanded digital JSA UI at app entrypoint"
          git push origin HEAD:${GITHUB_REF_NAME}
