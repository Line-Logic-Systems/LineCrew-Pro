name: Disposable Disaster Restore Test

on:
  pull_request:
    paths:
      - '.github/workflows/test-disaster-restore.yml'
      - 'scripts/post-restore-security.sql'
      - 'scripts/test-post-restore-security-gate.sh'
      - 'scripts/verify-post-restore-security.sql'
  schedule:
    - cron: '41 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: disposable-disaster-restore
  cancel-in-progress: false

jobs:
  security-gate-restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore and verify the global Data API security gate
        run: bash scripts/test-post-restore-security-gate.sh
      - name: Open immediate recovery alert
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/manage-recovery-alert.sh failure "Disposable Disaster Restore Test"

  restore-test:
    if: github.event_name != 'pull_request'
    needs: security-gate-restore-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: isolation-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Delete and restore synthetic company data and a private file
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
          LINECREW_RESTORE_TEST_CONFIRM: DISPOSABLE_ONLY
        run: node scripts/test-disaster-restore.mjs
      - name: Resolve prior recovery alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/manage-recovery-alert.sh success "Disposable Disaster Restore Test"
      - name: Open immediate recovery alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/manage-recovery-alert.sh failure "Disposable Disaster Restore Test"
