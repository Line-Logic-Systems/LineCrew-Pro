name: Apply Unit Entry Finish Controls
on:
  push:
    branches: [fix/unit-entry-finish-controls]
    paths:
      - scripts/patch-unit-entry-finish-controls.mjs
      - .github/workflows/apply-unit-entry-finish-controls.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/unit-entry-finish-controls
      - run: node scripts/patch-unit-entry-finish-controls.mjs
      - run: node scripts/validate-app.mjs
      - name: Commit source changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add bottom finish control to unit entry"
          git push origin HEAD:fix/unit-entry-finish-controls
