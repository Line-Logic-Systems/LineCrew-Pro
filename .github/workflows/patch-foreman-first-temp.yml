name: Patch Foreman First Temp
on:
  push:
    branches: [fix/foreman-first-at-source]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foreman-first-at-source
      - name: Patch timekeeping source
        shell: python
        run: |
          from pathlib import Path
          p = Path('timekeeping.js')
          s = p.read_text()
          old_select = ".select('id,employee_number,full_name,classification,default_crew_name,active,assigned_foreman_id')"
          new_select = ".select('id,employee_number,full_name,classification,default_crew_name,active,assigned_foreman_id,linked_profile_id')"
          if old_select in s:
              s = s.replace(old_select, new_select, 1)
          old = """    if(reportId){
      const {data,error}=await getSb().from('timekeeping_entries').select('employee_id,regular_hours,overtime_hours').eq('daily_report_id',reportId).order('created_at');
      if(!error && data?.length){data.forEach(addCrewRow);return;}
    }
    if(role()==='foreman'){
      const viewerId=typeof currentProfile!=='undefined' ? currentProfile?.id||null : null;
      employees.filter(e=>e.active&&e.assigned_foreman_id===viewerId).forEach(e=>addCrewRow({employee_id:e.id}));
      return;
    }
"""
          new = """    if(role()==='foreman'){
      const viewerId=typeof currentProfile!=='undefined' ? currentProfile?.id||null : null;
      const own=employees.find(e=>e.active&&e.linked_profile_id===viewerId)||null;
      if(reportId){
        const {data,error}=await getSb().from('timekeeping_entries').select('employee_id,regular_hours,overtime_hours').eq('daily_report_id',reportId).order('created_at');
        if(!error){
          const saved=data||[];
          const ownSaved=own?saved.find(x=>x.employee_id===own.id):null;
          if(own)addCrewRow(ownSaved||{employee_id:own.id});
          saved.filter(x=>!own||x.employee_id!==own.id).forEach(addCrewRow);
          if(saved.length||own)return;
        }
      }
      if(own)addCrewRow({employee_id:own.id});
      employees.filter(e=>e.active&&e.assigned_foreman_id===viewerId&&(!own||e.id!==own.id)).forEach(e=>addCrewRow({employee_id:e.id}));
      return;
    }
    if(reportId){
      const {data,error}=await getSb().from('timekeeping_entries').select('employee_id,regular_hours,overtime_hours').eq('daily_report_id',reportId).order('created_at');
      if(!error && data?.length){data.forEach(addCrewRow);return;}
    }
"""
          if old not in s:
              raise SystemExit('Expected loadCrewRowsForReport block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "LineCrew Pro Automation"
          git config user.email "actions@users.noreply.github.com"
          git add timekeeping.js
          git commit -m "Build Foreman row first in base timekeeping renderer"
          git push origin HEAD:fix/foreman-first-at-source