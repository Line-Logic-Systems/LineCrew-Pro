name: Generate training narration

on:
  workflow_dispatch:
    inputs:
      voice_name:
        description: ElevenLabs narrator voice name
        required: false
        default: Roger
        type: string

permissions:
  contents: read

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Generate slide narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_NAME: ${{ inputs.voice_name }}
        run: node scripts/generate-training-narration.mjs

      - name: Upload narration package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linecrew-pro-training-narration
          path: training/narration/output/
          if-no-files-found: error
          retention-days: 14
