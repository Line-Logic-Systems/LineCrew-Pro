name: Apply Weekly OT Company Week Start
on:
  push:
    branches: [fix/weekly-ot-and-draft-delete]
    paths:
      - scripts/apply-weekly-ot-company-week-start.mjs
      - .github/workflows/apply-weekly-ot-company-week-start.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/weekly-ot-and-draft-delete
      - run: node scripts/apply-weekly-ot-company-week-start.mjs
      - run: node scripts/validate-app.mjs
      - name: Commit source changes
        run: |
          if git diff --quiet -- index.html timekeeping.js timekeeping-input-v2.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html timekeeping.js timekeeping-input-v2.js
          git commit -m "Use company workweek for weekly OT"
          git push origin HEAD:fix/weekly-ot-and-draft-delete
