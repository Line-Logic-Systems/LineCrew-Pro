name: Refresh Admin Timekeeping Cache
on:
  push:
    branches: [fix/timekeeping-dense-admin-edit]
    paths: [.github/workflows/bump-timekeeping-admin-cache.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timekeeping-dense-admin-edit
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('expanded-jsa.js')
          s=p.read_text()
          old="timekeeping-report-v2.js?v=20260826c"
          if old not in s: raise SystemExit('expected report cache token not found')
          p.write_text(s.replace(old,"timekeeping-report-v2.js?v=20260826d",1))
          p=Path('index.html')
          s=p.read_text()
          old="expanded-jsa.js?v=20260826a"
          if old not in s: raise SystemExit('expected app cache token not found')
          p.write_text(s.replace(old,"expanded-jsa.js?v=20260826b",1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expanded-jsa.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bump Admin timekeeping browser assets"
          git push origin HEAD:fix/timekeeping-dense-admin-edit
