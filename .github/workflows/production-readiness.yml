name: Production Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate app shell
        run: node scripts/validate-app.mjs

      - name: Validate production readiness
        run: node scripts/validate-production-readiness.mjs

      - name: Validate LineCrew Assistant knowledge
        run: node scripts/validate-assistant-knowledge.mjs

      - name: Validate LineCrew Assistant live context
        run: node scripts/validate-assistant-live-context.mjs

      - name: Validate LineCrew Assistant memory safeguards
        run: node scripts/validate-assistant-memory.mjs
