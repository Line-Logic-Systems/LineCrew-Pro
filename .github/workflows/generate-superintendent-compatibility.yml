name: Generate Superintendent Compatibility
on:
  push:
    branches: [feature/owner-superintendent-roles]
    paths: [scripts/generate-superintendent-compatibility.mjs, .github/workflows/generate-superintendent-compatibility.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-superintendent-roles
      - run: node scripts/generate-superintendent-compatibility.mjs
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608190200_superintendent_legacy_compatibility.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add capability-aware Superintendent compatibility across secured RPCs"
          git push origin HEAD:feature/owner-superintendent-roles
