name: Fix Custom Time Loader Position
on:
  push:
    branches:
      - feature/custom-time-export-options
    paths:
      - .github/workflows/fix-custom-time-loader-position.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/custom-time-export-options
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="custom-time-export.js?v=20260826a"></script>'
          s=s.replace(tag+'\n','').replace(tag,'')
          pos=s.rfind('</body>')
          if pos < 0:
              raise SystemExit('final body close not found')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix custom export loader position"
          git push origin HEAD:feature/custom-time-export-options