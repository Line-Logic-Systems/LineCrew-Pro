name: Apply Role UI Patch

on:
  push:
    branches:
      - feature/owner-superintendent-roles
    paths:
      - scripts/apply-role-ui-patch.mjs
      - .github/workflows/apply-role-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-superintendent-roles
      - name: Apply role UI patch
        run: node scripts/apply-role-ui-patch.mjs
      - name: Validate app
        run: node scripts/validate-app.mjs
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Owner and Superintendent team controls"
          git push origin HEAD:feature/owner-superintendent-roles
