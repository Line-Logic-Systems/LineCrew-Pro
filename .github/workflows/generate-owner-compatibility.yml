name: Generate Owner Compatibility

on:
  push:
    branches:
      - feature/owner-superintendent-roles
    paths:
      - scripts/generate-owner-compatibility.mjs
      - .github/workflows/generate-owner-compatibility.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/owner-superintendent-roles
      - run: node scripts/generate-owner-compatibility.mjs
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608190100_owner_legacy_compatibility.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Owner compatibility across legacy secured RPCs"
          git push origin HEAD:feature/owner-superintendent-roles
