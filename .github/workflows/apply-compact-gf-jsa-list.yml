name: Apply Compact GF JSA List
on:
  push:
    branches: [ui/compact-gf-jsa-list]
    paths: [.github/workflows/apply-compact-gf-jsa-list.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/compact-gf-jsa-list
      - name: Tighten leadership JSA rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          anchor=""".supervisor-compact-report .report-summary-meta{\nfont-size:12px;\n}\n"""
          extra=""".supervisor-compact-report{\nmargin-bottom:3px;\nborder-radius:6px;\n}\n.supervisor-compact-report > summary{\nmin-height:30px;\npadding:4px 8px;\ngap:6px;\n}\n.supervisor-compact-report > summary::before{\nfont-size:9px;\n}\n.supervisor-compact-report .report-summary-main{\ngrid-template-columns:minmax(90px,120px) minmax(0,1fr);\ngap:6px;\n}\n.supervisor-compact-report .report-summary-main strong,\n.supervisor-compact-report .report-summary-main span,\n.supervisor-compact-report .report-summary-meta{\nfont-size:10px;\nline-height:1.05;\n}\n.supervisor-compact-report .report-card-details{\npadding:10px 12px 6px;\n}\n"""
          if extra not in s:
              if anchor not in s: raise SystemExit('compact supervisor CSS anchor not found')
              s=s.replace(anchor,anchor+extra,1)
          p.write_text(s)
          PY
      - name: Commit compact layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Compact leadership completed JSA rows'
          git push origin HEAD:ui/compact-gf-jsa-list