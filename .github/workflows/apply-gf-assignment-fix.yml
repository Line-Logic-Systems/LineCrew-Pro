name: Apply GF Assignment Fix
'on':
  push:
    branches:
      - fix/gf-assignment-duplicate-cache
    paths:
      - .github/workflows/apply-gf-assignment-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/gf-assignment-duplicate-cache
      - name: Apply patch
        run: python scripts/fix-gf-assignment-duplicate-cache.py
      - name: Validate syntax
        run: node --check gf-crew-scope.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gf-crew-scope.js
          git diff --cached --quiet || git commit -m 'Fix duplicate GF assignment panel and stale crew cache'
          git push origin HEAD:fix/gf-assignment-duplicate-cache