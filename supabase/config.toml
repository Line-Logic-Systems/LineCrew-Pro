# Keep authentication behavior in source control. All functions disable the
# legacy gateway JWT verifier so Auth can rotate to asymmetric signing keys.
# Each handler fails closed with its own appropriate check: Stripe signature,
# one-time invitation token, dual cron secrets, or Supabase Auth getUser().
[functions.stripe-webhook]
verify_jwt = false

[functions.complete-team-invitation-signup]
verify_jwt = false

[functions.capture-crew-usage]
verify_jwt = false

[functions.create-billing-checkout]
verify_jwt = false

[functions.create-billing-portal]
verify_jwt = false

[functions.create-plan-upgrade]
verify_jwt = false

[functions.linecrew-assistant]
verify_jwt = false

[functions.parse-utility-job-packet]
verify_jwt = false

[functions.send-team-invitation]
verify_jwt = false

[functions.notify-pilot-feedback]
verify_jwt = false
