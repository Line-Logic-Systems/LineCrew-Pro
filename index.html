<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta id="appViewport" name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
(function(){
try{
if(localStorage.getItem('linecrew-pro-desktop-view') === '1'){
document.getElementById('appViewport')
.setAttribute('content', 'width=1180,viewport-fit=cover');
document.documentElement.classList.add('desktop-view');
}
}catch(error){
// Device storage may be unavailable; keep the normal responsive layout.
}
})();
</script>
<meta name="theme-color" content="#071d31">
<meta name="application-name" content="LineCrew Pro">

<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<style>
:root{
--navy:#0b2d4d;
--blue:#1677d2;
--bg:#f3f6f9;
--card:#ffffff;
--text:#102235;
--muted:#6c7a89;
--border:#dce5ed;
--green:#198754;
--red:#b83232;
--orange:#d97706;
--app-content-width:850px;
}
*{
box-sizing:border-box;
}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}
header{
background:var(--navy);
color:white;
padding:28px 22px;
}
header .app-brand{
max-width:var(--app-content-width);
margin:auto;
display:flex;
align-items:center;
gap:16px;
}
header .app-brand-logo{
display:block;
width:68px;
height:68px;
object-fit:cover;
border-radius:12px;
box-shadow:0 8px 22px rgba(0,0,0,.24);
}
header h1{
margin:0;
font-size:30px;
}
header p{
margin:6px 0 0;
opacity:.85;
}
.company-brand-badge{
margin-left:auto;
display:flex;
align-items:center;
gap:10px;
max-width:310px;
padding:8px 11px;
border:1px solid rgba(255,255,255,.28);
border-radius:12px;
background:rgba(255,255,255,.1);
}
.company-brand-badge img{
display:block;
width:46px;
height:46px;
object-fit:contain;
border-radius:9px;
background:white;
padding:4px;
}
.company-brand-badge span{
font-size:14px;
font-weight:800;
line-height:1.2;
overflow-wrap:anywhere;
}
@media(max-width:600px){
header{padding:18px 16px;}
header .app-brand{flex-wrap:wrap;gap:12px;}
header .app-brand-logo{width:56px;height:56px;border-radius:10px;}
header h1{font-size:26px;}
.company-brand-badge{
width:100%;
max-width:none;
margin-left:0;
padding:7px 9px;
}
.company-brand-badge img{width:38px;height:38px;}
}
main{
max-width:var(--app-content-width);
margin:auto;
padding:24px 16px 100px;
}
@media(min-width:1000px){
:root{
--app-content-width:1440px;
}
main{
padding-left:28px;
padding-right:28px;
}
}
.storm-mode-banner{
border:2px solid var(--orange);
background:#fff7ed;
color:#7c2d12;
font-weight:700;
}
.storm-mode-banner strong{
color:#9a3412;
}
.jsa-section{
border:1px solid var(--border);
border-radius:14px;
padding:16px;
margin:18px 0;
background:#f8fafc;
}
.jsa-section h3{
margin-top:0;
}
.jsa-attachment-viewer{
position:fixed;
inset:0;
z-index:100;
background:rgba(6,20,34,.78);
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}
.jsa-attachment-viewer.hidden{
display:none!important;
}
.jsa-attachment-viewer-card{
width:min(1000px,100%);
max-height:94vh;
overflow:auto;
background:white;
border-radius:18px;
padding:16px;
box-shadow:0 18px 60px rgba(0,0,0,.35);
}
.jsa-attachment-viewer-header{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:12px;
position:sticky;
top:-16px;
background:white;
padding:4px 0 12px;
z-index:2;
}
.jsa-attachment-viewer-header button{
width:auto;
margin:0;
}
.jsa-attachment-grid{
display:grid;
gap:16px;
}
.jsa-attachment-page{
border:1px solid var(--border);
border-radius:14px;
padding:10px;
background:#f8fafc;
}
.jsa-attachment-page img{
display:block;
width:100%;
height:auto;
max-height:78vh;
object-fit:contain;
border-radius:10px;
background:white;
}
.jsa-attachment-page iframe{
width:100%;
min-height:72vh;
border:0;
border-radius:10px;
background:white;
}
.jsa-attachment-page-title{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
margin-bottom:8px;
font-weight:800;
}
@media(max-width:600px){
.jsa-attachment-viewer{padding:0;}
.jsa-attachment-viewer-card{border-radius:0;max-height:100vh;min-height:100vh;padding:12px;}
.jsa-attachment-viewer-header{top:-12px;}
.jsa-attachment-page iframe{min-height:68vh;}
}
.card{
background:var(--card);
border-radius:20px;
padding:22px;
margin-bottom:18px;
box-shadow:0 2px 12px rgba(0,0,0,.07);
}
.collapsible-card{
padding:0;
overflow:hidden;
}
.collapsible-card summary{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:16px 22px;
cursor:pointer;
font-weight:700;
list-style:none;
}
.collapsible-card summary::-webkit-details-marker{
display:none;
}
.collapsible-card summary::after{
content:'+ Show Filters';
color:var(--navy);
background:#e9f0f6;
border-radius:10px;
padding:8px 10px;
font-size:14px;
white-space:nowrap;
}
.collapsible-card[open] summary::after{
content:'− Hide Filters';
}
.collapsible-card[open] summary{
border-bottom:1px solid var(--border);
}
.collapsible-card-content{
padding:4px 22px 18px;
}
#safetyJsaHistoryCard > summary::after{
content:'+ Show History';
}
#safetyJsaHistoryCard[open] > summary::after{
content:'− Hide History';
}
#safetyJsaHistoryCard .collapsible-card-content{
padding:0 12px 12px;
}
#manageExistingContracts > summary::after{
content:'+ Manage Existing';
}
#manageExistingContracts[open] > summary::after{
content:'− Hide Existing';
}
#companyOnboarding > summary::after{
content:'+ View Steps';
}
#companyOnboarding[open] > summary::after{
content:'− Hide Steps';
}
#companyOnboardingList{
padding:0 22px 4px;
}
.contract-setup-card{
border:2px solid rgba(16,92,63,.16);
}
.contract-setup-steps{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin:18px 0;
}
.contract-setup-step{
display:flex;
align-items:center;
gap:8px;
padding:10px;
border:1px solid var(--border);
border-radius:12px;
background:var(--card);
color:var(--muted);
font-weight:700;
}
.contract-setup-step-number{
display:grid;
place-items:center;
width:28px;
height:28px;
border-radius:999px;
background:#e9f0f6;
color:var(--navy);
flex:0 0 auto;
}
.contract-setup-step.active{
border-color:#178a5b;
background:#eef9f3;
color:#105c3f;
}
.contract-setup-step.complete .contract-setup-step-number{
background:#178a5b;
color:white;
}
.contract-setup-start{
padding:16px;
border:1px solid var(--border);
border-radius:14px;
background:#f8fafc;
}
.contract-setup-start .button-row{
margin-top:8px;
}
.contract-management-content{
padding-top:18px;
}
.contract-management-section{
padding-bottom:18px;
margin-bottom:18px;
border-bottom:1px solid var(--border);
}
.contract-management-section:last-child{
padding-bottom:0;
margin-bottom:0;
border-bottom:0;
}
#safetyJsaRecordChooser{
padding:12px 0;
}
#safetyJsaRecordChooser label{
display:block;
margin-bottom:6px;
}
#safetyJsaRecordChooser .muted{
margin:6px 0 0;
font-size:12px;
}
#safetyJsaList{
border:1px solid var(--border);
border-radius:12px;
overflow:hidden;
background:var(--card);
}
#safetyJsaList .safety-jsa-history-row{
margin:0;
border:0;
border-radius:0;
box-shadow:none;
background:var(--card);
}
#safetyJsaList .safety-jsa-history-row + .safety-jsa-history-row{
border-top:1px solid var(--border);
}
#safetyJsaList .safety-jsa-history-row > summary{
padding:14px 12px;
}
#safetyJsaList .report-summary-main,
#safetyJsaList .report-summary-meta{
min-width:0;
overflow-wrap:anywhere;
}
.daily-value-summary > span{
min-width:0;
overflow-wrap:anywhere;
}
.status,.role,.button-row button,.section-header button{
max-width:100%;
overflow-wrap:anywhere;
white-space:normal;
}
@media(max-width:600px){
#safetyJsaHistoryCard > summary{align-items:flex-start;flex-wrap:wrap;padding:14px 16px;}
#safetyJsaHistoryCard .collapsible-summary-count{margin-left:0;}
#safetyJsaHistoryCard > summary::after{margin-left:auto;}
}
.collapsible-summary-count{
margin-left:auto;
font-weight:400;
color:var(--muted);
font-size:14px;
}
.production-pagination{
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
margin:12px 0;
}
.production-pagination .pagination-status{
color:var(--muted);
font-weight:700;
}
.production-pagination .pagination-actions{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:6px;
}
.production-pagination select{
width:auto;
min-width:92px;
padding:9px 10px;
}
.production-pagination button{
margin:0;
}
.production-job-group{
padding:0;
overflow:hidden;
margin-bottom:10px;
}
.production-job-group > summary{
display:grid;
grid-template-columns:auto minmax(0, 1fr) auto;
align-items:center;
gap:12px;
padding:13px 16px;
cursor:pointer;
list-style:none;
}
.production-job-group > summary::-webkit-details-marker{ display:none; }
.production-job-group > summary::before{
content:'▶';
color:var(--blue);
font-size:12px;
}
.production-job-group[open] > summary::before{ content:'▼'; }
.production-job-group-main{ min-width:0; }
.production-job-group-main strong,
.production-job-group-main span{
display:block;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}
.production-job-group-meta{
text-align:right;
white-space:nowrap;
font-size:13px;
}
.production-job-group-reports{
border-top:1px solid var(--border);
padding:8px;
background:#f7fafc;
}
.production-job-group-reports .compact-report-card{
margin:6px 0;
background:#fff;
}
.production-contract-summary{
border:1px solid var(--border);
border-radius:14px;
margin-top:12px;
overflow:hidden;
background:#fff;
}
.production-contract-summary > summary{
display:grid;
grid-template-columns:minmax(0, 1fr) auto;
align-items:center;
justify-content:space-between;
gap:12px;
padding:14px 16px;
cursor:pointer;
list-style:none;
}
.production-contract-summary > summary::-webkit-details-marker{ display:none; }
.production-contract-summary > summary::after{
content:'View Jobs';
color:var(--navy);
background:#e9f0f6;
border-radius:10px;
padding:7px 10px;
font-size:12px;
font-weight:800;
white-space:nowrap;
}
.production-contract-summary > summary .production-reporting-group-metrics{
grid-column:1 / -1;
width:100%;
}
.production-contract-summary[open] > summary::after{ content:'Hide Jobs'; }
.production-contract-body{
border-top:1px solid var(--border);
padding:12px;
background:#f7fafc;
}
.production-job-totals{
border:1px solid var(--border);
border-radius:12px;
padding:12px;
margin-top:10px;
background:#fff;
}
.production-job-totals h4{ margin:0 0 4px; }
.production-reporting-contracts{ margin-top:10px; }
.production-utility-grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
margin-top:12px;
}
.production-utility-card{
width:100%;
margin:0;
padding:16px;
text-align:left;
color:var(--text);
background:#fff;
border:1px solid var(--border);
border-radius:14px;
box-shadow:none;
}
.production-utility-card:hover{
border-color:var(--blue);
background:#f7fbff;
}
.production-utility-card strong,
.production-utility-card span{ display:block; }
.production-utility-card .muted{ margin-top:5px; }
.production-utility-card .daily-value-summary{
display:flex;
margin-top:12px;
text-align:left;
}
.production-utility-card .daily-value-summary > span{
display:block;
}
.billing-batch-card{
border:1px solid var(--border);
border-radius:9px;
padding:11px 13px;
margin:8px 0;
background:#fff;
}
.billing-batch-card .section-header{ margin:0; }
.billing-status{
display:inline-block;
border-radius:999px;
padding:3px 8px;
background:#e8eef4;
font-size:11px;
font-weight:800;
text-transform:uppercase;
}
.billing-status.submitted{ background:#fff1c2; color:#854d0e; }
.billing-status.paid{ background:#dff7e7; color:#166534; }
.billing-status.void{ background:#fde5e5; color:#b42318; }
.billing-preview-scroll{ overflow:auto; margin-top:12px; }
.billing-preview-table{
width:100%;
min-width:900px;
border-collapse:collapse;
font-size:12px;
}
.billing-preview-table th,
.billing-preview-table td{
border-bottom:1px solid var(--border);
padding:7px 8px;
text-align:left;
vertical-align:top;
}
.billing-preview-table th{ background:#eef4f8; }
.billing-preview-table .currency,
.billing-preview-table .quantity{ text-align:right; white-space:nowrap; }
.billing-redline-row{ background:#fff4f4; }
.compact-report-card{
padding:0;
overflow:hidden;
}
.compact-report-card > summary{
display:grid;
grid-template-columns:auto minmax(0, 1fr) auto;
align-items:center;
gap:12px;
padding:14px 16px;
cursor:pointer;
list-style:none;
}
.compact-report-card > summary::-webkit-details-marker{
display:none;
}
.compact-report-card > summary::before{
content:'▶';
color:var(--blue);
font-size:12px;
}
.compact-report-card[open] > summary::before{
content:'▼';
}
.compact-report-card .report-summary-main{
min-width:0;
}
.compact-report-card .report-summary-main strong,
.compact-report-card .report-summary-main span{
display:block;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}
.compact-report-card .report-summary-meta{
text-align:right;
white-space:nowrap;
font-size:14px;
}
.compact-report-card .report-card-details{
border-top:1px solid var(--border);
padding:14px 16px 6px;
}
.compact-report-card > button{
margin:4px 4px 12px;
}
.supervisor-compact-report{
margin-bottom:6px;
border-radius:9px;
}
.supervisor-compact-report > summary{
min-height:42px;
padding:7px 12px;
gap:8px;
}
.supervisor-compact-report .report-summary-main{
display:grid;
grid-template-columns:minmax(90px, 130px) minmax(0, 1fr);
align-items:center;
gap:8px;
}
.supervisor-compact-report .report-summary-main strong,
.supervisor-compact-report .report-summary-main span{
display:block;
font-size:12px;
line-height:1.2;
}
.supervisor-compact-report .report-summary-meta{
font-size:12px;
}
.supervisor-compact-report{
margin-bottom:3px;
border-radius:6px;
}
.supervisor-compact-report > summary{
min-height:30px;
padding:4px 8px;
gap:6px;
}
.supervisor-compact-report > summary::before{
font-size:9px;
}
.supervisor-compact-report .report-summary-main{
grid-template-columns:minmax(90px,120px) minmax(0,1fr);
gap:6px;
}
.supervisor-compact-report .report-summary-main strong,
.supervisor-compact-report .report-summary-main span,
.supervisor-compact-report .report-summary-meta{
font-size:10px;
line-height:1.05;
}
.supervisor-compact-report .report-card-details{
padding:10px 12px 6px;
}
@media(max-width:600px){
.production-job-group > summary{
grid-template-columns:auto minmax(0, 1fr);
}
.production-job-group-meta{
grid-column:2;
text-align:left;
white-space:normal;
}
.compact-report-card > summary{
grid-template-columns:auto minmax(0, 1fr);
}
.compact-report-card .report-summary-meta{
grid-column:2;
text-align:left;
}
.supervisor-compact-report .report-summary-main{
grid-template-columns:1fr;
gap:2px;
}
}
h2{
margin-top:0;
}
h3{
margin-top:0;
}
label{
display:block;
font-weight:700;
margin:14px 0 6px;
}
input,
select,
textarea{
width:100%;
padding:14px;
border:1px solid var(--border);
border-radius:12px;
font-size:16px;
background:white;
color:var(--text);
}
input[type="color"]{
min-height:46px;
padding:4px;
cursor:pointer;
}
#adminNotice > summary{
list-style:none;
}
#adminNotice > summary::-webkit-details-marker{
display:none;
}
#adminNotice[open] > summary .role{
visibility:hidden;
}
.collapsible-card-body{
padding:0 22px 22px;
}
.assistant-launcher{
position:fixed;
right:20px;
bottom:20px;
width:auto;
z-index:30
