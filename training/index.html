<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b2d4d">
  <title>LineCrew Pro Training Center</title>
  <link rel="stylesheet" href="./training-center.css">
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#102235;background:#f3f6f9}
    body{margin:0;background:#f3f6f9}
    .topbar{background:#0b2d4d;color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .topbar strong{font-size:24px}.topbar a{color:white;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,.4);padding:9px 12px;border-radius:10px}
    #signedOut{max-width:720px;margin:60px auto;padding:28px;background:white;border-radius:18px;border:1px solid #dce5ed;text-align:center}
    #signedOut a{display:inline-block;background:#1677d2;color:white;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <strong>LineCrew Pro Training</strong>
    <a href="/">Back to App</a>
  </header>
  <main>
    <div id="signedOut" hidden>
      <h2>Subscriber Training</h2>
      <p>Sign in to your LineCrew Pro company account to access training.</p>
      <a href="/">Go to LineCrew Pro Login</a>
    </div>
    <div id="trainingRoot"></div>
  </main>

  <script>
    const LINECREW_PRODUCTION_HOSTS=new Set(['linecrewpro.com','www.linecrewpro.com','app.linecrewpro.com']);
    const IS_LINECREW_PRODUCTION=LINECREW_PRODUCTION_HOSTS.has(window.location.hostname.toLowerCase());
    const SUPABASE_URL=IS_LINECREW_PRODUCTION?'https://ldgkyxuozbozgkvwzadg.supabase.co':'https://yvuxrqrdprquxypiffpa.supabase.co';
    const SUPABASE_KEY=IS_LINECREW_PRODUCTION?'sb_publishable_U1i3_vuo8mMELcpcsW7aog_bcPNlYYF':'sb_publishable_4_B1KxInXhARmcfE6LLAyA_5O7bSoqx';
    window.supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    if(!IS_LINECREW_PRODUCTION){
      const sandboxBanner=document.createElement('div');sandboxBanner.setAttribute('role','status');
      sandboxBanner.textContent='SANDBOX TEST — No real companies or training records';
      sandboxBanner.style.cssText='background:#fff3cd;color:#664d03;border-bottom:1px solid #ffecb5;padding:9px 14px;text-align:center;font-weight:800;font-size:13px';
      document.body.prepend(sandboxBanner);
    }
  </script>
  <script src="./training-center.js"></script>
  <script>
    (async()=>{
      const {data:{session}}=await window.supabaseClient.auth.getSession();
      if(!session){
        document.getElementById('trainingRoot').hidden=true;
        document.getElementById('signedOut').hidden=false;
        return;
      }
      await window.LineCrewTrainingCenter.render(document.getElementById('trainingRoot'));
    })();
  </script>
</body>
</html>
